; Configuracao PlatformIO para o Prototipo Fisico ESP32-WROOM-32
; Compilacao : pio run
; Upload     : pio run --target upload
; Monitor    : pio device monitor

[platformio]
src_dir = esp32_ultrasonic_bot
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters =
    direct
    time
build_flags =
    -Wall
    -Wextra
